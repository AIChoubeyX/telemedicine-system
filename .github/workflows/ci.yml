name: Amrutam Telemedicine Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: amrutam_telemedicine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/amrutam_telemedicine_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/amrutam_telemedicine_test?schema=public
      JWT_SECRET: ci-runner-amrutam-jwt-secret-key-at-least-32-chars-long
      REFRESH_TOKEN_SECRET: ci-runner-amrutam-refresh-jwt-secret-key-at-least-32-chars-long
      LOG_LEVEL: fatal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run ESLint
        run: npm run lint

      - name: Apply Database Migrations to PostgreSQL
        run: npx prisma migrate deploy

      - name: Run Automated Vitest Test Suite (with Concurrency Tests)
        run: npm test
